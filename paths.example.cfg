# OmniCell data folders
#
# Copy this file to paths.cfg (same folder, the root of the repository) and
# fill in the paths for your machine. paths.cfg is ignored by git, so your
# folders never reach a commit. This file stays as it is.
#
# One setting per line: NAME=path. No quotes. Lines starting with # are notes.
# An environment variable with the same name overrides the value here.
# See SETUP.md for what each folder is for and which tools read it.

# Where recorded sessions and everything decoded from them are written.
# Keep it outside the repository. Created if it does not exist.
# Read by Tools\Capture\capture-dir.bat (every capture and decode script).
CAPTURES=

# The network adapter your game traffic goes through, as Wireshark names it -
# for example Wi-Fi or Ethernet. "C:\Program Files\Wireshark\tshark.exe" -D
# lists them, with the name in brackets. Only needed for recording.
# Read by Tools\Capture\capture-marked.bat.
CAPTURE_INTERFACE=

# Your Anarchy Online client install - the folder that contains cd_image.
# Read by the Extractor Serializer to build items.ocp, nanos.ocp and
# playfields.ocp. Nothing is ever copied out of it into the repository.
AO_CLIENT=
